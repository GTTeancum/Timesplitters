# TimeSplitters display settings. The game's Audio / Video Options menu
# changes these and saves them here; you can also edit this file directly.
# While playing: F9 toggles FXAA, F10 toggles widescreen (not saved),
# F11 toggles fullscreen. Alt+F4 quits (or Exit Game in the menu).

# Window size in pixels.
resolution = 1920x1080

# 1 = borderless fullscreen.
fullscreen = 0

# 1 = 16:9 widescreen (the game shows a wider view), 0 = original 4:3.
widescreen = 1

# 1 = smooth jagged edges (FXAA).
fxaa = 1

# 1 = V-Sync: frames are shown in step with the display (no tearing).
vsync = 1

# Mouse for player 1, beside the keyboard and a controller: moving the mouse
# looks around (the right stick), left button = R1 (fire), right = L1,
# middle = R2. The pointer is held in the window while it has focus.
# 0 = off. mouse_sensitivity: 0.1 (slow) to 10 (fast).
mouse = 1
mouse_sensitivity = 1.0

# Internal rendering resolution: 1 = PS2 native, 2..4 = sharper (HD).
render_scale = 4

# Texture replacement. 1 = save every new texture the game uses to
# textures/dump/<id>.png (slower while it runs). Put edited or higher
# resolution PNGs with the same file name anywhere under
# textures/replacements/ and the game draws them instead (texture_replace = 1).
texture_dump = 0
texture_replace = 1
